# This is a Declarative Automation Bundle definition for crypto_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: crypto_lakehouse
  uuid: 28688a06-b9c5-4e30-9676-e527a6d280df

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4a6afdcd-da6d.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-4a6afdcd-da6d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/chafa.tess@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chafa.tess@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: chafa.tess@gmail.com
        level: CAN_MANAGE
